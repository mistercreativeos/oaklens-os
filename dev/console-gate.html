<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>FIELD CONSOLE — LOGIN</title>
<script>
/* Anti-flash mode boot — the same `console_theme` key the console's own head
   script reads (dev/field-console.html), so the door opens into the room in
   the same light instead of flashing black at someone working in DAYLIGHT.
   Inline and pre-paint on purpose: this page loads no stylesheet to wait on. */
try {
  var _t = localStorage.getItem('console_theme')
        || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  if (_t === 'light') document.documentElement.dataset.theme = 'light';
} catch (e) {}
</script>
<!--
  The console gate. Served by the worker (with status 401) in place of the
  Field Console document whenever the request carries no valid console-shell
  cookie — see the shell gate in worker.js. On a successful login /api/auth
  answers with BOTH credentials: the Set-Cookie that unlocks the document and
  the bearer token the console API layer uses; the script below stashes the
  token in sessionStorage (the console's SESSION_KEY) and reloads, so one
  password entry lands the owner straight in a logged-in console.

  Deliberately self-contained and identity-neutral: no site name, no shared
  CSS/JS, no service-worker registration — an unauthenticated visitor learns
  nothing here but "a login exists", and the page keeps working on a fork
  before any branding is configured.

  IT WEARS THE CONSOLE'S OWN LOGIN CARD (owner, 2026-10-06). It had its own
  design — a filament that warmed as you typed and ignited on submit — and so
  the console had two doors that looked nothing alike. Now it is the same
  card the console raises over itself (#login-modal in field-console.html):
  the header with its accent rule, PASSWORD, the well, the red ENTER. The one
  difference is the title — FIELD CONSOLE where the modal says the site's
  name, because no name reaches a visitor who has not signed in.

  The ONE thing the edge adds is `data-preset` on <html> (worker.js, the shell
  gate branch): a palette name, which every public page of the same site
  already carries, so the door is in the fork's own colour. It is not
  identity — no name, tagline, coordinates or meta come near this page, and
  the rewriter used there is a two-attribute one, NOT injectSiteChrome.
-->
<style>
  /* The console's login card (#login-modal), copied. The values are the
     console's own, read off the rendered modal; tests/console-gate-lighting
     .test.js holds the tokens to the console's so the two cannot drift. */
  @font-face { font-family: 'Syne Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/syne-mono-latin.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/ibm-plex-mono-latin-400.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 500; font-display: swap; src: url('/fonts/ibm-plex-mono-latin-500.woff2') format('woff2'); }

  :root {
    /* The brand. Base values are noir; a preset overrides the channels. */
    --brand-rgb:     255, 0, 0;
    --brand-ink-rgb: 196, 17, 17;   /* the same brand recalibrated for paper */

    --surface-0: #000000;
    --surface-1: #0c0c0c;
    --ink-1: #f2f2f2;
    --ink-3: #8f8f8f;
    --ember: 6%;
    --line-2: color-mix(in srgb, rgb(var(--accent-rgb)) var(--ember), #242424);
    --accent-rgb:  var(--brand-rgb);
    --accent-text: #ff2b2b;
    --lit-rgb:     var(--accent-rgb);
    --font-mono:   'Syne Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    color-scheme: dark;
  }
  /* The presets: channels, and the console's mono for each. */
  :root[data-preset="aperture"]      { --brand-rgb: 86, 128, 255;  --brand-ink-rgb: 30, 63, 219;  --accent-text: #8FA8FF; }
  :root[data-preset="passe-partout"] { --brand-rgb: 196, 96, 79;   --brand-ink-rgb: 150, 58, 48;  --accent-text: #E08A75; }
  :root[data-preset="selenium"]      { --brand-rgb: 216, 103, 74;  --brand-ink-rgb: 184, 72, 44;  --accent-text: #E08063; }
  :root[data-preset="cyanotype"]     { --brand-rgb: 92, 159, 206;  --brand-ink-rgb: 35, 100, 142; --accent-text: #85BADF; }
  :root[data-preset]:not([data-preset="noir"]) { --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace; }

  :root[data-theme="light"] {
    --surface-0: #f4f1ea;
    --surface-1: #fbf9f4;
    --ink-1: #131210;
    --ink-3: #6b675f;
    --ember: 4%;
    --line-2: color-mix(in srgb, rgb(var(--accent-rgb)) var(--ember), #d3cec2);
    --accent-rgb:  var(--brand-ink-rgb, 196, 17, 17);
    --accent-text: rgb(var(--brand-ink-rgb, 196, 17, 17));
    color-scheme: light;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100dvh;
    display: grid; place-items: center; padding: 20px;
    color: var(--ink-1); font-family: var(--font-mono); font-size: 14px;
    /* The room the card sits in: the console's dimmed backdrop, with the
       brand's light pooling at the floor. */
    background:
      radial-gradient(135% 72% at 50% 104%, rgba(var(--lit-rgb), 0.18) 0%, rgba(var(--lit-rgb), 0.06) 34%, transparent 70%),
      var(--surface-0);
  }
  :root[data-theme="light"] body {
    background: radial-gradient(135% 72% at 50% 104%, rgba(var(--lit-rgb), 0.06) 0%, transparent 60%), var(--surface-0);
  }

  .card {
    width: min(360px, 100%);
    border-radius: 10px;
    border-bottom: 1px solid var(--line-2);
    background:
      linear-gradient(0deg, rgba(var(--lit-rgb), 0.086) 0%, rgba(var(--lit-rgb), 0.03) 38%, rgba(var(--lit-rgb), 0) 72%),
      color-mix(in srgb, var(--surface-1) 72%, transparent);
    box-shadow:
      inset 0 -30px 34px -30px rgba(var(--lit-rgb), 0.133),
      inset 0 -1px 0 0 rgba(var(--lit-rgb), 0.53),
      inset 0 1px 0 0 color-mix(in srgb, var(--ink-1) 6%, transparent),
      0 6px 40px 0 rgba(var(--lit-rgb), 0.11),
      0 0 110px 0 rgba(var(--lit-rgb), 0.063);
  }
  :root[data-theme="light"] .card {
    background: var(--surface-1);
    box-shadow: 0 12px 40px 0 rgba(60, 50, 30, 0.28);
  }
  .card-header { padding: 18px 22px 14px; border-bottom: 2px solid rgb(var(--accent-rgb)); }
  h1 { font-size: 0.85rem; font-weight: 400; letter-spacing: 0.16em; color: var(--ink-1); }
  .card-body { padding: 22px; }
  label {
    display: block; margin-bottom: 5px;
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3);
  }
  input[type="password"] {
    width: 100%; padding: 10px 12px; border-radius: 4px;
    font: 0.85rem var(--font-mono); color: var(--ink-1);
    border: 1px solid transparent;
    background: linear-gradient(rgba(3, 3, 4, 0.84), rgba(3, 3, 4, 0.66));
    box-shadow: inset 0 2px 4px -1px rgba(0, 0, 0, 0.7), inset 0 -1px 0 0 rgba(var(--lit-rgb), 0.25);
  }
  input[type="password"]:focus { outline: none; box-shadow: inset 0 2px 4px -1px rgba(0, 0, 0, 0.7), inset 0 -1px 0 0 rgba(var(--lit-rgb), 0.6); }
  :root[data-theme="light"] input[type="password"] { background: #fff; border-color: #d3cec2; box-shadow: none; }
  :root[data-theme="light"] input[type="password"]:focus { border-color: rgb(var(--accent-rgb)); }
  #gate-error { min-height: 18px; margin-top: 8px; font-size: 0.62rem; letter-spacing: 1.5px; color: var(--accent-text); }
  .card-footer { padding: 14px 22px; }
  button {
    width: 100%; padding: 12px 16px; border-radius: 4px; cursor: pointer;
    font: 700 0.72rem var(--font-mono); letter-spacing: 0.13em; text-transform: uppercase;
    color: #fff; border: 1px solid transparent;
    background: linear-gradient(175deg, rgba(var(--lit-rgb), 0.74), rgba(var(--lit-rgb), 0.56));
    box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.18), inset 0 -1px 0 0 rgba(0, 0, 0, 0.25), 0 6px 24px -6px rgba(var(--lit-rgb), 0.6);
    transition: transform 120ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--surface-1), 0 0 0 4px var(--accent-text); }
  button:disabled { cursor: default; opacity: 0.6; }
  :root[data-theme="light"] button { background: rgb(var(--accent-rgb)); border-color: rgb(var(--accent-rgb)); box-shadow: none; }
  .pm-username { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<form id="gate-form" class="card" method="post" action="/api/auth">
  <div class="card-header"><h1>FIELD CONSOLE</h1></div>
  <div class="card-body">
    <input class="pm-username" type="text" name="username" value="console"
           autocomplete="username" tabindex="-1" aria-hidden="true">
    <label for="gate-password">Password</label>
    <input type="password" name="password" id="gate-password"
           autocomplete="current-password" required autofocus>
    <div id="gate-error" role="alert"></div>
  </div>
  <div class="card-footer">
    <button type="submit" id="gate-btn">→ ENTER</button>
  </div>
</form>
<script>
(function () {
  var form = document.getElementById('gate-form');
  var btn = document.getElementById('gate-btn');
  var errEl = document.getElementById('gate-error');
  var pwEl = document.getElementById('gate-password');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = pwEl.value;
    if (!pw) return;
    btn.disabled = true;
    errEl.textContent = '';
    fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw }),
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (res.ok && data.ok && data.token) {
          // The Set-Cookie on this response unlocked the document; hand the
          // bearer token to the console (its SESSION_KEY) and reload into it.
          try { sessionStorage.setItem('oaklens_session', data.token); } catch (err) {}
          location.reload();
          return;
        }
        btn.disabled = false;
        pwEl.value = '';
        pwEl.focus();
        errEl.textContent = '✕ ' + (res.status === 429
          ? 'too many attempts — wait a minute'
          : (data.error || 'invalid credentials'));
      });
    }).catch(function () {
      btn.disabled = false;
      errEl.textContent = '✕ network error — try again';
    });
  });
})();
</script>
</body>
</html>
